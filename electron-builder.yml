appId: com.madrimov.zenfocus
productName: ZenFocus
copyright: Copyright © 2026 madrimov

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: .env
    to: .env

extraMetadata:
  main: dist/main/index.js

linux:
  target:
    - target: AppImage
      arch: [x64]
  extraResources:
    - from: bin/linux/yt-dlp
      to: bin/yt-dlp

win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: bin/win/yt-dlp.exe
      to: bin/yt-dlp.exe

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  url: https://update.example.com/releases
