appId: com.madrimov.zenfocus
productName: ZenFocus
copyright: Copyright © 2026 madrimov

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources/tray-icon.png
    to: tray-icon.png

extraMetadata:
  main: dist/main/index.js

linux:
  target:
    - target: AppImage
      arch: [x64]
  extraResources:
    - from: bin/linux/yt-dlp
      to: bin/yt-dlp

win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: bin/win/yt-dlp.exe
      to: bin/yt-dlp.exe

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: madrimovDev
  repo: lofi-pomodoro
  private: false
